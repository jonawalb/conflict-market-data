name: backfill-subgraph

# One-off research backfill: full trade tapes for a list of closed markets, pulled
# from the public orderbook subgraph (scripts/backfill_subgraph.py). Results are
# uploaded as workflow artifacts, not committed, so the repository stays small.

on:
  workflow_dispatch:
    inputs:
      frame:
        description: "Contract list CSV (frame_row, slug, event_slug)"
        default: "data/backfill_v6/probe.csv"
        required: true
      limit:
        description: "Resolve only the first N rows (0 = all)"
        default: "0"
        required: false
      source:
        description: "subgraph (pull) or api (pull-api)"
        default: "subgraph"
        required: false
      shard_list:
        description: "Comma-separated shard indices to run (parallel jobs)"
        default: "0"
        required: false

concurrency:
  group: backfill-${{ github.event.inputs.source }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve slugs to token ids
        run: |
          python3 scripts/backfill_subgraph.py resolve \
            --frame "${{ github.event.inputs.frame }}" --out out \
            --limit "${{ github.event.inputs.limit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: meta
          path: out/meta.jsonl

  pull:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(format('[{0}]', github.event.inputs.shard_list)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: meta
          path: out
      - name: Pull tapes
        run: |
          cmd=pull; [ "${{ github.event.inputs.source }}" = "api" ] && cmd=pull-api
          python3 scripts/backfill_subgraph.py "$cmd" --meta out/meta.jsonl --out out \
            --shard ${{ matrix.shard }} \
            --shards ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapes-${{ matrix.shard }}
          path: |
            out/tapes/
            out/tapes_api/
            out/pull_stats_*.jsonl
            out/pull_api_stats_*.jsonl
            out/meta.jsonl
          if-no-files-found: warn
