name: refresh-registry

# Rediscovers the market universe and reclassifies it. Also serves as the
# keepalive: GitHub disables scheduled workflows after 60 days with no
# repository activity, and commits made by the Actions token do not always
# reset that timer, so this job fails loudly if the registry has gone stale.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run classifier tests before touching the registry
        run: python3 test_classify.py

      - name: Refresh market registry
        run: python3 scripts/ci_collect.py --mode discover

      - name: Commit registry
        run: |
          git config user.name  "bow-collector[bot]"
          git config user.email "bow-collector@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "registry unchanged"
            exit 0
          fi
          git commit -m "data(registry): refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
